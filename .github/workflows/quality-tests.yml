name: Stage 1 Evidence Regression Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all Stage-1 unit tests without network calls
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -p 'test_*discovery*.py' -v
          python -m unittest discover -s tests -p 'test_structured_evidence.py' -v
          python -m unittest discover -s tests -p 'test_crypto_evidence_engine.py' -v
          python -m unittest discover -s tests -p 'test_evidence_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_event_sources.py' -v
          python -m unittest discover -s tests -p 'test_research_collector.py' -v
          python -m unittest discover -s tests -p 'test_free_open_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_coin_context_sources.py' -v
          python -m unittest discover -s tests -p 'test_targeted_primary_context.py' -v
          python -m unittest discover -s tests -p 'test_coin_news_resolution.py' -v
          python -m unittest discover -s tests -p 'test_coin_primary_feed_research.py' -v
          python -m unittest discover -s tests -p 'test_coin_repository_releases.py' -v
          python -m unittest discover -s tests -p 'test_coin_project_sitemap_news.py' -v
