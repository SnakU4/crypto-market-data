name: Crypto Evidence Engine - Structured Sources
on:
  push:
    # One deployment-time live acceptance run, NOT a new competing run for
    # every code/test commit (which caused archive rebase conflicts).
    paths:
      - '.github/workflows/crypto-evidence-engine.yml'
  workflow_dispatch:
  schedule:
    - cron: '42 11,23 * * *'
permissions:
  contents: write
concurrency:
  group: crypto-structured-evidence
  cancel-in-progress: false
jobs:
  structured:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline engine tests
        run: |
          python -m compileall -q src/crypto_evidence_engine.py src/evidence_extensions.py src/evidence_intelligence.py tests/test_crypto_evidence_engine.py tests/test_evidence_intelligence.py tests/test_event_sources.py
          python -m unittest discover -s tests -p 'test_crypto_evidence_engine.py' -v
          python -m unittest discover -s tests -p 'test_evidence_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_event_sources.py' -v
      - name: Fetch public structured evidence
        run: python src/crypto_evidence_engine.py
      - name: Verify complete archive, provenance and unified acceptance report
        run: |
          python - <<'PY'
          import gzip, hashlib, json, pathlib
          root=pathlib.Path('.')
          out=root/'docs'/'evidence_engine'
          meta=json.loads((out/'status.json').read_text())
          archive=root/meta['archive_path']
          assert archive.exists() and archive.suffix=='.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==meta['archive_sha256']
          with gzip.open(archive,'rt',encoding='utf8') as inp:
              count=sum(1 for line in inp if json.loads(line))
          assert count==meta['records']
          report=json.loads((out/'integrated_quality_report.json').read_text())
          events=json.loads((out/'event_candidates.json').read_text())
          deltas=json.loads((out/'delta_candidates.json').read_text())
          assert report['certified_9_out_of_10']==meta['stage1_9_of_10_verified']
          assert report['anchored_cmc100_asset_count']<=100
          assert events['total_event_candidates']==meta['event_candidates_total']
          assert deltas['capture_utc']==meta['capture_utc']
          assert len(meta['source_audit'])==meta['configured_sources']
          print('VERIFIED PIT ARCHIVE',count,'records;',
                'sources',meta['successful_sources'],'/',meta['configured_sources'],
                'quality diagnostic',report['diagnostic_score_out_of_10'],
                '9/10 certified',report['certified_9_out_of_10'])
          PY
      - name: Publish independent immutable snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence_engine/
          if ! git diff --cached --quiet; then
            git commit -m "Structured evidence $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
