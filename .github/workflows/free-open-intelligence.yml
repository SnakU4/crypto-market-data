name: CMC100 Free Open Intelligence – Broad Discovery

on:
  workflow_dispatch:
  schedule:
    # Free public GitHub-hosted runner; source availability and runtime monitored.
    - cron: '45 05,17 * * *'

permissions:
  contents: write

concurrency:
  group: cmc100-free-open-intelligence
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify production code syntax; optional offline tests run manually
        run: python -m py_compile src/free_open_intelligence.py src/coin_context_sources.py src/targeted_primary_context.py src/primary_source_discovery.py
          python -m unittest discover -s tests -p 'test_targeted_primary_context.py' -v
          python -m unittest discover -s tests -p 'test_coin_context_sources.py' -v
          python -m unittest discover -s tests -p 'test_free_open_intelligence.py' -v

      - name: Integrate all research planes and EXECUTE bounded free follow-up searches
        run: |
          python src/free_open_intelligence.py --network --max-followups 20 --max-articles 80

      - name: Audit 100 coins, complete inputs and real research coverage
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("docs/intelligence")
          m=json.loads((p/"manifest.json").read_text())
          c=json.loads((p/"coverage_audit.json").read_text())
          assert m["no_paid_api_used"] is True and m["llm_calls"]==0
          assert m["all_100_verified"] is True
          assert len(m["coin_batch_files"])==5
          assert all(v["verified"] for v in m["archives"].values())
          assert len(c["source_planes_integrated"])==5
          assert c["adjacent_discovery_source"]["mode"]=="FULL_ARCHIVE"
          assert c["adaptive_search_hops_executed"] in (1,2)
          assert c["per_coin"]["perp_markets_unquarantined"] <= 77
          assert "substantive_source_excerpt_leads" in c["evidence_counts"]
          assert m["source_backed_project_profile_file"]=="docs/intelligence/coin_profiles.json"
          assert m["original_issuer_project_context_file"]=="docs/intelligence/primary_coin_context.json"
          primary=json.loads((p/"primary_coin_context.json").read_text())
          assert primary["audit"]["mapped_projects"] >= 15
          assert all(row["source_kind"] in ("ISSUER_DOCUMENTATION","EXCHANGE_ANNOUNCEMENT_NOT_ISSUER")
                     for row in primary["profiles"].values())
          assert c["per_coin"]["coins_missing_substantive_project_background_combined"] + c["per_coin"]["coins_with_substantive_project_background_combined"] == 100
          profiles=json.loads((p/"coin_profiles.json").read_text())
          assert profiles["audit"]["assets"] == 100
          assert len(profiles["audit"]["profile_gaps"]) + profiles["audit"]["substantive_project_profiles"] == 100
          assert c["per_coin"]["source_backed_substantive_project_background"] == profiles["audit"]["substantive_project_profiles"]
          assert c["research_quality_gate"]["project_background_not_fresh_catalyst"] is True
          assert (c["per_coin"]["coins_with_substantive_coin_specific_context"] +
                  c["per_coin"]["coins_missing_substantive_coin_specific_context"]) == 100
          assert c["research_quality_gate"]["all_100_coins_have_substantive_source_linked_context"] == (
                  c["per_coin"]["coins_missing_substantive_coin_specific_context"] == 0)
          assert c["evidence_counts"]["manual_high_context_selection_count"] > 0
          assert c["research_quality_gate"]["raw_all_leads_denominator_unchanged"]
          assert m["source_probe_history_file"]=="docs/intelligence/source_probe_history.json"
          assert m["article_attempt_history_file"]=="docs/intelligence/article_attempt_history.json"
          assert (p/"article_attempt_history.json").is_file()
          assert c["research_quality_gate"]["technical_source_integration"]=="PASSED"
          assert c["research_quality_gate"]["independently_primary_verified_claims"]==0
          assert c["research_quality_gate"]["material_research_status"] in ("PARTIAL_RESEARCH","REQUIRES_INDEPENDENT_SEMANTIC_VALIDATION")
          ids=[]
          for name in m["coin_batch_files"]:
              co=json.loads(pathlib.Path(name).read_text())["coins"]
              assert len(co)==20
              ids += [int(x["cmc_id"]) for x in co]
          assert len(ids)==100 and len(set(ids))==100
          assert c["evidence_counts"]["engine_rows"]>0
          assert c["evidence_counts"]["expanded_rows"]>0
          assert c["evidence_counts"]["research_event_rows"]>0
          assert c["evidence_counts"]["adjacent_full_event_rows"]>0
          assert c["evidence_counts"]["canonical_research_leads"]>0
          tasks=json.loads((p/"research_tasks.json").read_text())["tasks"]
          assert len(tasks)>0, "No emergent or anomaly follow-up planning"
          assert all(t["status"] in {"QUERIED","FAILED"} for t in tasks)
          raw=p/"export/evidence_index.jsonl"
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==m["full_evidence_sha256"]
          assert sum(1 for _ in raw.open())==m["full_evidence_count"]
          # QNT instrument is excluded from quantitative data pending a verified product identity.
          qnt=next(x for n in m["coin_batch_files"] for x in
                   json.loads(pathlib.Path(n).read_text())["coins"] if x["cmc_id"]==3155)
          assert qnt["perp_market"] is None and qnt["perp_identity_status"]=="QUARANTINED"
          print("FREE OPEN INTELLIGENCE ACCEPTED:",m["full_evidence_count"],
                "canonical+adaptive leads; adaptive status",[
                (x["status"],x["results"]) for x in tasks])
          PY

      - name: Upload complete combined evidence index – available for manual ChatGPT research
        uses: actions/upload-artifact@v4
        with:
          name: CMC100-Free-Open-Intelligence-Evidence
          retention-days: 7
          compression-level: 6
          path: |
            docs/intelligence/export/
            docs/intelligence/manifest.json
            docs/intelligence/coverage_audit.json
            docs/intelligence/coin_profiles.json
            docs/intelligence/primary_coin_context.json
            docs/intelligence/global_intelligence.json
            docs/intelligence/sector_intelligence.json
            docs/intelligence/coin_batches/
            docs/intelligence/research_tasks.json
            docs/intelligence/open_discovery.json
            docs/intelligence/publisher_excerpts.json
            docs/intelligence/deep_research_queue.json
            docs/intelligence/source_registry_proposals.json
            docs/intelligence/discovered_public_feeds.json
            docs/intelligence/source_probe_history.json
            docs/intelligence/article_attempt_history.json

      - name: Publish concise reusable research output to public GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/intelligence/manifest.json docs/intelligence/coverage_audit.json \
            docs/intelligence/coin_profiles.json \
            docs/intelligence/primary_coin_context.json \
            docs/intelligence/global_intelligence.json docs/intelligence/sector_intelligence.json \
            docs/intelligence/coin_batches docs/intelligence/open_discovery.json \
            docs/intelligence/research_tasks.json docs/intelligence/publisher_excerpts.json \
            docs/intelligence/deep_research_queue.json \
            docs/intelligence/source_registry_proposals.json \
            docs/intelligence/discovered_public_feeds.json \
            docs/intelligence/source_probe_history.json \
            docs/intelligence/article_attempt_history.json \
            docs/intelligence/knowledge_index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update free global, cross-sector and 100-coin intelligence $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
